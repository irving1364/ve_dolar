name: Recolectar tasas cada 30 min

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar endpoint de recoleccion
        run: |
          curl -sS --max-time 30 -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_API_URL }}/api/cron"
