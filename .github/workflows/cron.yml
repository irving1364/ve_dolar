name: Recolectar tasas cada 30 min

# Cron desactivado: se usa FastCron como scheduler unico para /api/cron.
# Se deja workflow_dispatch para poder disparar una corrida manual si hace falta.
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar endpoint de recoleccion
        run: |
          curl -sS --max-time 30 -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_API_URL }}/api/cron"
